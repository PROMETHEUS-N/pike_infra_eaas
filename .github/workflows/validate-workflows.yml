name: PIKE Workflow Validation

on:
  # Run validation whenever workflow definitions change.
  push:
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  # Allow the deployment workflow to call this as a reusable validation job.
  workflow_call: {}

permissions:
  contents: read

jobs:
  validate-yaml:
    name: YAML, GitHub Actions and Security Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # actionlint checks workflow YAML parsing and GitHub Actions semantics.
      # Install its precompiled binary; no pip or Python packages are required.
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.7.12"
          ARCHIVE="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${ARCHIVE}" \
            --output "${RUNNER_TEMP}/${ARCHIVE}"
          tar -xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TEMP}" actionlint
          sudo install "${RUNNER_TEMP}/actionlint" /usr/local/bin/actionlint
          actionlint -version

      - name: Validate GitHub Actions workflows
        id: actionlint
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          actionlint -color 2>&1 | tee "${RUNNER_TEMP}/actionlint.log"
          exit ${PIPESTATUS[0]}

      - name: Analyze workflow security with zizmor
        id: zizmor
        continue-on-error: true
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.32.0
          inputs: .github/workflows
          advanced-security: false
          annotations: true

      # Create a machine-readable report even when one or more checks fail.
      - name: Generate CSV validation report
        id: report
        if: always()
        env:
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const reportDir = path.join(process.env.GITHUB_WORKSPACE, 'validation-report');
          fs.mkdirSync(reportDir, { recursive: true });

          const csv = (value) => {
            const text = String(value ?? '').replace(/\r?\n/g, ' ').trim();
            return '"' + text.replace(/"/g, '""') + '"';
          };

          const status = (outcome) => outcome === 'success' ? 'PASS' : 'FAIL';
          const details = (file, fallback) => {
            try {
              return fs.readFileSync(file, 'utf8').trim() || fallback;
            } catch {
              return fallback;
            }
          };

          const rows = [
            ['Run_ID', 'Run_Number', 'Timestamp_UTC', 'Branch_or_Ref', 'Commit_SHA', 'Workflow_Files', 'Validation_Tool', 'Validation_Type', 'Status', 'Details'],
            [
              process.env.RUN_ID,
              process.env.RUN_NUMBER,
              new Date().toISOString(),
              process.env.REF,
              process.env.SHA,
              '.github/workflows/**',
              'actionlint',
              'YAML syntax and GitHub Actions workflow validation',
              status(process.env.ACTIONLINT_OUTCOME),
              details(path.join(process.env.RUNNER_TEMP, 'actionlint.log'), 'actionlint completed without captured output')
            ],
            [
              process.env.RUN_ID,
              process.env.RUN_NUMBER,
              new Date().toISOString(),
              process.env.REF,
              process.env.SHA,
              '.github/workflows/**',
              'zizmor',
              'GitHub Actions security analysis',
              status(process.env.ZIZMOR_OUTCOME),
              'See the zizmor step log and annotations for detailed findings'
            ]
          ];

          const output = rows.map(row => row.map(csv).join(',')).join('\n') + '\n';
          fs.writeFileSync(path.join(reportDir, 'pike-validation-report.csv'), output, 'utf8');
          NODE

      - name: Upload CSV validation report
        if: always() && steps.report.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PIKE-Workflow-Validation-Report-${{ github.run_id }}
          path: validation-report/pike-validation-report.csv
          if-no-files-found: error
          retention-days: 30

      # Fail the reusable workflow after the report has been uploaded.
      - name: Enforce validation result
        if: always()
        env:
          ACTIONLINT_OUTCOME: ${{ steps.actionlint.outcome }}
          ZIZMOR_OUTCOME: ${{ steps.zizmor.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
        shell: bash
        run: |
          if [[ "${ACTIONLINT_OUTCOME}" != "success" || "${ZIZMOR_OUTCOME}" != "success" || "${REPORT_OUTCOME}" != "success" ]]; then
            echo "Workflow validation failed. Review the CSV artifact and validation logs."
            exit 1
          fi
          echo "All workflow validations passed and the CSV report was generated."
