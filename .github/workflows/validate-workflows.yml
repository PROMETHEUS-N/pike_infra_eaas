name: Validate-Workflows

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Bicep, GitHub Actions and input validation
    runs-on: [self-hosted, X64, Windows]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install or update Azure CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "AzureCLI.msi"
          Invoke-WebRequest -Uri "https://aka.ms/installazurecliwindowsx64" -OutFile $installer
          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/i", "`"$installer`"", "/quiet", "/norestart") -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Azure CLI installation failed with exit code $($process.ExitCode)."
          }
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"
          if (-not (Test-Path -LiteralPath $az)) { throw "Azure CLI was not found at the expected installation path." }
          & $az version
          if ($LASTEXITCODE -ne 0) { throw "Azure CLI verification failed." }

      - name: Install or update Bicep CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"
          & $az bicep install
          if ($LASTEXITCODE -ne 0) { throw "Bicep installation failed." }
          & $az bicep upgrade
          if ($LASTEXITCODE -ne 0) { throw "Bicep upgrade failed." }
          & $az bicep version
          if ($LASTEXITCODE -ne 0) { throw "Bicep version verification failed." }

      - name: Build and lint every Bicep file
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"
          $files = @(Get-ChildItem -Path . -Filter "*.bicep" -File -Recurse |
            Where-Object { $_.FullName -notmatch '[\\/](\.git|\.bicep-cache)[\\/]' } |
            Sort-Object FullName)
          if ($files.Count -eq 0) { throw "No Bicep files were found in the repository." }

          $failures = [System.Collections.Generic.List[string]]::new()
          Write-Host "Found $($files.Count) Bicep file(s). Each file will be compiled and checked by the configured Bicep linter."
          foreach ($file in $files) {
            Write-Host "::group::Bicep validation: $($file.FullName)"
            $output = & $az bicep build --file $file.FullName --stdout 2>&1
            $exitCode = $LASTEXITCODE
            if ($output) { $output | ForEach-Object { Write-Host $_ } }
            if ($exitCode -ne 0) {
              $failures.Add("$($file.FullName) (exit code $exitCode)")
              Write-Error "Bicep build failed: $($file.FullName)" -ErrorAction Continue
            } else {
              Write-Host "PASS: $($file.FullName)"
            }
            Write-Host "::endgroup::"
          }
          if ($failures.Count -gt 0) {
            throw "Bicep validation failed for $($failures.Count) file(s): $($failures -join '; ')"
          }
          Write-Host "All $($files.Count) Bicep files passed compilation."

      - name: Install and run actionlint against all workflow YAML files
        id: actionlint
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $workflowFiles = @(Get-ChildItem -Path ".github/workflows" -File -Recurse |
            Where-Object { $_.Extension -in @(".yml", ".yaml") } |
            Sort-Object FullName | ForEach-Object { $_.FullName })
          if ($workflowFiles.Count -eq 0) { throw "No workflow YAML files found under .github/workflows/." }

          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/rhysd/actionlint/releases/latest" -Headers @{
            "Accept" = "application/vnd.github+json"
            "User-Agent" = "PIKE-infrastructure-validation"
          }
          $asset = $release.assets | Where-Object { $_.name -match '^actionlint_.*_windows_amd64\.zip$' } | Select-Object -First 1
          if ($null -eq $asset) { throw "Could not find the Windows AMD64 actionlint release asset." }

          $zipPath = Join-Path $env:RUNNER_TEMP "actionlint.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "actionlint"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath
          if (Test-Path -LiteralPath $extractPath) { Remove-Item -LiteralPath $extractPath -Recurse -Force }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractPath -Force
          $actionlint = Get-ChildItem -Path $extractPath -Filter "actionlint.exe" -File -Recurse | Select-Object -First 1
          if ($null -eq $actionlint) { throw "actionlint.exe was not found in the downloaded release." }

          $reportDir = Join-Path $env:RUNNER_TEMP "pike-validation"
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null
          Write-Host "Running actionlint $($release.tag_name) against $($workflowFiles.Count) workflow file(s)."
          $lintOutput = & $actionlint.FullName @workflowFiles 2>&1
          $lintExit = $LASTEXITCODE
          $lintOutput | Out-String | Set-Content (Join-Path $reportDir "actionlint.txt") -Encoding UTF8
          "ExitCode=$lintExit" | Set-Content (Join-Path $reportDir "actionlint-meta.txt")
          "Version=$($release.tag_name)" | Add-Content (Join-Path $reportDir "actionlint-meta.txt")
          "Files=$($workflowFiles.Count)" | Add-Content (Join-Path $reportDir "actionlint-meta.txt")
          if ($lintOutput) { $lintOutput | ForEach-Object { Write-Host $_ } }
          if ($lintExit -ne 0) { throw "actionlint reported one or more GitHub Actions workflow errors." }
          Write-Host "All GitHub Actions workflow YAML files passed actionlint."

      - name: Validate input.json syntax and structure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $inputPath = Join-Path (Get-Location) "input.json"
          if (-not (Test-Path -LiteralPath $inputPath)) { throw "input.json was not found in the repository root." }

          try {
            $jsonText = Get-Content -LiteralPath $inputPath -Raw
            $cfg = ConvertFrom-Json -InputObject $jsonText -ErrorAction Stop
          } catch {
            throw "input.json is not valid JSON: $($_.Exception.Message)"
          }

          if ($null -eq $cfg -or $cfg -is [System.Array]) { throw "input.json root must be a JSON object." }
          $environment = ([string]$cfg.environment).Trim().ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($environment)) { throw "input.json must contain a root-level environment." }
          if ($environment -ne "dev") { throw "Expected environment 'dev' but found '$environment'." }
          if ([string]::IsNullOrWhiteSpace([string]$cfg.location)) { throw "input.json must contain a non-empty root-level location." }
          if ($null -eq $cfg.landingZones -or $cfg.landingZones -is [System.Array]) { throw "input.json must contain a landingZones object." }

          $knownArrays = @(
            "resourceGroups", "nsgs", "routeTables", "vnets", "subnets",
            "loadBalancers", "applicationGatewaySubnets", "applicationGateways",
            "vms", "storageAccounts", "keyVaults", "sqlDatabases", "openAiServices"
          )
          foreach ($name in $knownArrays) {
            $property = $cfg.landingZones.PSObject.Properties[$name]
            if ($null -ne $property -and $null -ne $property.Value -and $property.Value -isnot [System.Array]) {
              throw "landingZones.$name must be an array when provided."
            }
            if ($null -ne $property -and $null -ne $property.Value) {
              if (@($property.Value | Where-Object { $null -eq $_ }).Count -gt 0) {
                throw "landingZones.$name contains a null entry."
              }
            }
          }

          if ($null -ne $cfg.rbac) {
            foreach ($name in @("subscriptionAccess", "resourceGroupAccess", "resourceAccess")) {
              $property = $cfg.rbac.PSObject.Properties[$name]
              if ($null -ne $property -and $null -ne $property.Value -and $property.Value -isnot [System.Array]) {
                throw "rbac.$name must be an array when provided."
              }
            }
          }
          Write-Host "input.json passed JSON parsing and root/resource collection structure checks."
      - name: Install and run zizmor security analysis
        id: zizmor
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $reportDir = Join-Path $env:RUNNER_TEMP "pike-validation"
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/zizmorcore/zizmor/releases/latest" -Headers @{ "Accept"="application/vnd.github+json"; "User-Agent"="PIKE-validation" }
          $asset = $release.assets | Where-Object { $_.name -eq "zizmor-x86_64-pc-windows-msvc.zip" } | Select-Object -First 1
          if ($null -eq $asset) { throw "Windows x64 zizmor release asset not found." }
          $zip = Join-Path $env:RUNNER_TEMP "zizmor.zip"
          $dest = Join-Path $env:RUNNER_TEMP "zizmor"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $exe = Get-ChildItem $dest -Filter "zizmor.exe" -Recurse -File | Select-Object -First 1
          if ($null -eq $exe) { throw "zizmor.exe was not found in release archive." }
          $result = & $exe.FullName --format=json .github/workflows 2> (Join-Path $reportDir "zizmor-stderr.txt")
          $code = $LASTEXITCODE
          $result | Out-File (Join-Path $reportDir "zizmor.json") -Encoding utf8
          "ExitCode=$code" | Set-Content (Join-Path $reportDir "zizmor-meta.txt")
          "Version=$($release.tag_name)" | Add-Content (Join-Path $reportDir "zizmor-meta.txt")
          if ($code -ne 0) { throw "zizmor returned exit code $code." }
          Write-Host "zizmor analysis completed."

      - name: Generate Excel validation report
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $env:RUNNER_TEMP "pike-validation"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $am = Get-Content (Join-Path $dir "actionlint-meta.txt") -ErrorAction SilentlyContinue
          $al = Get-Content (Join-Path $dir "actionlint.txt") -Raw -ErrorAction SilentlyContinue
          $acode = if ($am -match "ExitCode=0") { "PASS" } elseif ($am) { "FAIL" } else { "NOT RUN" }
          $aver = (($am | Where-Object { $_ -like "Version=*" }) -replace "^Version=","")
          $afiles = (($am | Where-Object { $_ -like "Files=*" }) -replace "^Files=","")
          if ([string]::IsNullOrWhiteSpace($al)) { $al = "No diagnostics" }
          $z = @()
          $zp = Join-Path $dir "zizmor.json"
          if (Test-Path $zp) {
            try { $z = @(Get-Content $zp -Raw | ConvertFrom-Json) } catch { $z = @() }
          }
          $zm = Get-Content (Join-Path $dir "zizmor-meta.txt") -ErrorAction SilentlyContinue
          $zcode = if ($zm -match "ExitCode=0") { "PASS" } elseif ($zm) { "FAIL" } else { "NOT RUN" }
          $zver = (($zm | Where-Object { $_ -like "Version=*" }) -replace "^Version=","")
          $rows = @()
          $rows += ,@("Check","Status","Version","Files scanned","Findings / diagnostics")
          $rows += ,@("actionlint",$acode,$aver,$afiles,$al)
          $rows += ,@("zizmor",$zcode,$zver,".github/workflows",[string]$z.Count)
          $summary = $rows
          $details = @()
          $details += ,@("Audit","Severity","Confidence","File","Line","Finding")
          foreach ($f in $z) {
            $line = [string]$f.location.start_line
            if (-not $line) { $line = [string]$f.location.row }
            $details += ,@([string]$f.audit,[string]$f.severity,[string]$f.confidence,[string]$f.location.path,$line,[string]$f.title)
          }
          if ($details.Count -eq 1) { $details += ,@("No findings","","","","","No zizmor findings returned") }
          Add-Type -AssemblyName System.IO.Compression
          $path = Join-Path (Get-Location) "pike-workflow-validation-report.xlsx"
          if (Test-Path $path) { Remove-Item $path -Force }
          $fs = [IO.File]::Open($path,[IO.FileMode]::CreateNew)
          $za = [IO.Compression.ZipArchive]::new($fs,[IO.Compression.ZipArchiveMode]::Create)
          function Put($z,$n,$s) { $e=$z.CreateEntry($n); $w=[IO.StreamWriter]::new($e.Open(),[Text.UTF8Encoding]::new($false)); $w.Write($s); $w.Dispose() }
          function XCol($n) { $s=""; while($n -gt 0){$n--; $s=[char](65+($n%26))+$s; $n=[math]::Floor($n/26)}; $s }
          function XSheet($data) {
            $b=[Text.StringBuilder]::new()
            [void]$b.Append('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>')
            for($r=0;$r -lt $data.Count;$r++){
              [void]$b.Append("<row r="+[char]34+($r+1)+[char]34+">")
              for($k=0;$k -lt $data[$r].Count;$k++){
                $ref=(XCol ($k+1))+($r+1)
                $v=[Security.SecurityElement]::Escape([string]$data[$r][$k])
                [void]$b.Append("<c r="+[char]34+$ref+[char]34+" t="+[char]34+"inlineStr"+[char]34+"><is><t xml:space="+[char]34+"preserve"+[char]34+">"+$v+"</t></is></c>")
              }
              [void]$b.Append("</row>")
            }
            [void]$b.Append("</sheetData></worksheet>"); $b.ToString()
          }
          Put $za "[Content_Types].xml" '<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet3.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'
          Put $za "_rels/.rels" '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'
          Put $za "xl/workbook.xml" '<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Summary" sheetId="1" r:id="rId1"/><sheet name="Actionlint" sheetId="2" r:id="rId2"/><sheet name="Zizmor" sheetId="3" r:id="rId3"/></sheets></workbook>'
          Put $za "xl/_rels/workbook.xml.rels" '<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet3.xml"/></Relationships>'
          Put $za "xl/worksheets/sheet1.xml" (XSheet $summary)
          Put $za "xl/worksheets/sheet2.xml" (XSheet @(@("Tool","Status","Version","Files scanned","Diagnostics"),@("actionlint",$acode,$aver,$afiles,$al)))
          Put $za "xl/worksheets/sheet3.xml" (XSheet $details)
          $za.Dispose(); $fs.Dispose()
          Write-Host "Created Excel report: $path"

      - name: Upload Excel validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PIKE-Workflow-Validation-${{ github.run_id }}
          path: pike-workflow-validation-report.xlsx
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce actionlint and zizmor results
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.actionlint.outcome }}" -ne "success") { throw "actionlint validation failed." }
          if ("${{ steps.zizmor.outcome }}" -ne "success") { throw "zizmor validation failed." }

          Write-Host "Note: detailed per-resource property validation requires a JSON Schema or dedicated validation rules."
