name: PIKE Access Management - RBAC and PIM

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment containing the Azure OIDC configuration
        required: false
        type: string
        default: dev

permissions:
  contents: read
  id-token: write

jobs:
  manage-access:
    name: Process RBAC and PIM access requests
    runs-on: [self-hosted, X64, Windows]
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Process RBAC and PIM entries from input.json
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RUN_ID: ${{ github.run_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $az = "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin\az.cmd"
          if (-not (Test-Path -LiteralPath $az)) { $az = "az" }
          if (-not (Test-Path -LiteralPath "input.json")) { throw "input.json was not found." }

          $cfg = Get-Content "input.json" -Raw | ConvertFrom-Json
          $results = [System.Collections.Generic.List[object]]::new()

          function Add-Result {
            param([string]$Type,[string]$Scope,[string]$Target,[string]$Principal,[string]$Role,[string]$Status,[string]$Id="",[string]$ErrorMessage="")
            $results.Add([PSCustomObject]@{ AccessType=$Type; Scope=$Scope; Target=$Target; Principal=$Principal; Role=$Role; Status=$Status; RequestOrAssignmentId=$Id; Error=$ErrorMessage })
          }

          function Get-Entries {
            param($Object,[string]$Name)
            if ($null -eq $Object) { return @() }
            $p = $Object.PSObject.Properties[$Name]
            if ($null -eq $p -or $null -eq $p.Value) { return @() }
            return @($p.Value | Where-Object { $null -ne $_ })
          }

          function Resolve-Principal {
            param($Entry)
            if (-not [string]::IsNullOrWhiteSpace([string]$Entry.principalId)) {
              if ([string]$Entry.principalId -notmatch '^[0-9a-fA-F-]{36}$') { throw "principalId must be an Entra object ID GUID." }
              return ([string]$Entry.principalId).ToLowerInvariant()
            }
            if ([string]::IsNullOrWhiteSpace([string]$Entry.principalEmail)) { throw "principalId or principalEmail is required." }
            $type = [string]$Entry.principalType
            if ([string]::IsNullOrWhiteSpace($type)) { $type = "User" }
            switch ($type) {
              "User" { $value = & $az ad user show --id $Entry.principalEmail --query id -o tsv 2>&1 }
              "Group" { $value = & $az ad group show --group $Entry.principalEmail --query id -o tsv 2>&1 }
              "ServicePrincipal" { $value = & $az ad sp show --id $Entry.principalEmail --query id -o tsv 2>&1 }
              default { throw "Unsupported principalType '$type'. Use User, Group, or ServicePrincipal." }
            }
            if ($LASTEXITCODE -ne 0) { throw "Entra principal lookup failed: $($value -join ' ')" }
            $id = ($value -join "").Trim()
            if ($id -notmatch '^[0-9a-fA-F-]{36}$') { throw "Principal lookup did not return a valid object ID." }
            return $id.ToLowerInvariant()
          }

          function Invoke-Rbac {
            param([string]$ScopeName,[string]$Template,[string]$DeploymentScope,[string]$Target,$Entry,[hashtable]$Extra=@{})
            $principal = if ($Entry.principalEmail) { [string]$Entry.principalEmail } else { [string]$Entry.principalId }
            try {
              if (-not (Test-Path -LiteralPath $Template)) { throw "Bicep template not found: $Template" }
              if ([string]::IsNullOrWhiteSpace([string]$Entry.roleDefinitionGuid)) { throw "roleDefinitionGuid is required." }
              $parameters = @{ principalId=(Resolve-Principal $Entry); roleDefinitionGuid=[string]$Entry.roleDefinitionGuid; principalType=([string]$Entry.principalType) }
              if ([string]::IsNullOrWhiteSpace($parameters.principalType)) { $parameters.principalType = "User" }
              foreach ($key in $Extra.Keys) { $parameters[$key] = $Extra[$key] }
              $parameterObject = @{ '$schema'='https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#'; contentVersion='1.0.0.0'; parameters=@{} }
              foreach ($key in $parameters.Keys) { $parameterObject.parameters[$key] = @{ value=$parameters[$key] } }
              $parameterFile = Join-Path $env:RUNNER_TEMP "rbac-$([guid]::NewGuid()).json"
              $parameterObject | ConvertTo-Json -Depth 30 | Set-Content -Path $parameterFile -Encoding utf8
              $deploymentName = "pike-rbac-$ScopeName-$env:RUN_ID-$([guid]::NewGuid().ToString('N').Substring(0,8))"
              $whatIf = @("deployment",$DeploymentScope,"what-if","--name","$deploymentName-preview","--template-file",$Template,"--parameters","@$parameterFile")
              $create = @("deployment",$DeploymentScope,"create","--name",$deploymentName,"--template-file",$Template,"--parameters","@$parameterFile","--output","json")
              if ($DeploymentScope -eq "sub") {
                $location = [string]$cfg.location
                if ([string]::IsNullOrWhiteSpace($location)) { throw "Root-level input.json location is required for subscription RBAC." }
                $whatIf += @("--location",$location); $create += @("--location",$location)
              } else {
                $whatIf += @("--resource-group",$Target); $create += @("--resource-group",$Target)
              }
              & $az @whatIf
              if ($LASTEXITCODE -ne 0) { throw "RBAC What-If failed." }
              $output = & $az @create
              if ($LASTEXITCODE -ne 0) { throw "RBAC deployment failed." }
              $deployment = ($output -join "`n") | ConvertFrom-Json
              Add-Result "RBAC" $ScopeName $Target $principal ([string]$Entry.roleDefinitionName) "DEPLOYED" ([string]$deployment.properties.outputs.roleAssignmentId.value)
            } catch {
              Add-Result "RBAC" $ScopeName $Target $principal ([string]$Entry.roleDefinitionName) "FAILED" "" $_.Exception.Message
              Write-Warning "RBAC $ScopeName failed: $($_.Exception.Message)"
            }
          }

          function Invoke-Pim {
            param($Entry)
            $principal = if ($Entry.principalEmail) { [string]$Entry.principalEmail } else { [string]$Entry.principalId }
            $scopeName = [string]$Entry.scope.type
            $target = ""
            try {
              $principalId = Resolve-Principal $Entry
              $subscriptionId = [string]$env:AZURE_SUBSCRIPTION_ID
              switch ($scopeName.ToLowerInvariant()) {
                "subscription" { $scopeId = "/subscriptions/$subscriptionId"; $target = $scopeId }
                "resourcegroup" {
                  if ([string]::IsNullOrWhiteSpace([string]$Entry.scope.resourceGroupName)) { throw "scope.resourceGroupName is required." }
                  $scopeId = "/subscriptions/$subscriptionId/resourceGroups/$($Entry.scope.resourceGroupName)"
                  $target = [string]$Entry.scope.resourceGroupName
                }
                "resource" {
                  $scopeId = [string]$Entry.scope.resourceId
                  if ($scopeId -notmatch '^/subscriptions/[0-9a-fA-F-]{36}/') { throw "scope.resourceId must be a full Azure resource ID." }
                  $target = $scopeId
                }
                default { throw "PIM scope.type must be Subscription, ResourceGroup, or Resource." }
              }
              if ([string]::IsNullOrWhiteSpace($subscriptionId)) { throw "AZURE_SUBSCRIPTION_ID is unavailable." }

              $roleId = [string]$Entry.roleDefinitionId
              if ([string]::IsNullOrWhiteSpace($roleId)) { $roleId = [string]$Entry.roleDefinitionGuid }
              if ([string]::IsNullOrWhiteSpace($roleId)) { throw "roleDefinitionId or roleDefinitionGuid is required." }
              if ($roleId -match '^[0-9a-fA-F-]{36}$') { $roleId = "/subscriptions/$subscriptionId/providers/Microsoft.Authorization/roleDefinitions/$roleId" }
              if ($roleId -notmatch '^/') { throw "roleDefinitionId must be a GUID or full Azure role definition resource ID." }

              $requestType = [string]$Entry.requestType
              $allowed = @("AdminAssign","AdminUpdate","AdminRemove","AdminExtend","AdminRenew")
              if ($requestType -notin $allowed) { throw "requestType must be one of: $($allowed -join ', ')." }

              $schedule = $Entry.schedule
              if ($null -eq $schedule) { throw "PIM schedule object is required." }
              $expirationType = [string]$schedule.expirationType
              if ([string]::IsNullOrWhiteSpace($expirationType)) { $expirationType = "AfterDuration" }
              if ($expirationType -notin @("AfterDuration","NoExpiration","AfterDateTime")) { throw "Unsupported schedule.expirationType." }
              $start = [string]$schedule.startDateTime
              if ([string]::IsNullOrWhiteSpace($start)) { $start = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ") }
              $expiration = @{ type=$expirationType }
              if ($expirationType -eq "AfterDuration") {
                $duration = [string]$schedule.duration
                if ($duration -notmatch '^P(?=\d|T\d)(\d+Y)?(\d+M)?(\d+D)?(T(\d+H)?(\d+M)?(\d+S)?)?$') { throw "schedule.duration must be an ISO 8601 duration such as PT2H, P30D, or P1Y." }
                $expiration.duration = $duration
              } elseif ($expirationType -eq "AfterDateTime") {
                if ([string]::IsNullOrWhiteSpace([string]$schedule.endDateTime)) { throw "schedule.endDateTime is required for AfterDateTime." }
                $expiration.endDateTime = [string]$schedule.endDateTime
              }
              $properties = @{
                principalId=$principalId
                roleDefinitionId=$roleId
                requestType=$requestType
                justification=([string]$Entry.justification)
                scheduleInfo=@{ startDateTime=$start; expiration=$expiration }
              }
              if ([string]::IsNullOrWhiteSpace($properties.justification)) { $properties.justification = "Requested through PIKE access workflow." }
              if ($Entry.ticketInfo) {
                $properties.ticketInfo = @{ ticketSystem=[string]$Entry.ticketInfo.ticketSystem; ticketNumber=[string]$Entry.ticketInfo.ticketNumber }
              }
              if ($requestType -ne "AdminAssign") {
                if ([string]::IsNullOrWhiteSpace([string]$Entry.targetRoleEligibilityScheduleId)) { throw "targetRoleEligibilityScheduleId is required for $requestType." }
                $properties.targetRoleEligibilityScheduleId = [string]$Entry.targetRoleEligibilityScheduleId
              }
              $requestId = [guid]::NewGuid().ToString()
              $uri = "https://management.azure.com$($scopeId)/providers/Microsoft.Authorization/roleEligibilityScheduleRequests/$requestId?api-version=2020-10-01-preview"
              $body = @{ properties=$properties } | ConvertTo-Json -Depth 30 -Compress
              $response = & $az rest --method put --url $uri --headers "Content-Type=application/json" --body $body --output json 2>&1
              if ($LASTEXITCODE -ne 0) { throw "PIM role eligibility request failed: $($response -join ' ')" }
              $responseObject = ($response -join "`n") | ConvertFrom-Json
              $requestResourceId = if ($responseObject.id) { [string]$responseObject.id } else { $requestId }
              Add-Result "PIM" $scopeName $target $principal ([string]$Entry.roleDefinitionName) "SUBMITTED" $requestResourceId
            } catch {
              Add-Result "PIM" $scopeName $target $principal ([string]$Entry.roleDefinitionName) "FAILED" "" $_.Exception.Message
              Write-Warning "PIM request failed: $($_.Exception.Message)"
            }
          }

          # Process only RBAC collections present in input.json.
          $subscriptionEntries = @(Get-Entries $cfg.rbac "subscriptionAccess")
          $resourceGroupEntries = @(Get-Entries $cfg.rbac "resourceGroupAccess")
          $resourceEntries = @(Get-Entries $cfg.rbac "resourceAccess")

          foreach ($entry in $subscriptionEntries) {
            Invoke-Rbac "subscription" "modules/access/rbac/RBAC_subscription.bicep" "sub" "Subscription" $entry
          }
          foreach ($entry in $resourceGroupEntries) {
            $rgName = [string]$entry.resourceGroupName
            $matches = @($cfg.landingZones.resourceGroups | Where-Object { $_.rgName -eq $rgName })
            if ($matches.Count -ne 1) {
              Add-Result "RBAC" "ResourceGroup" $rgName ([string]$entry.principalEmail) ([string]$entry.roleDefinitionName) "FAILED" "" "Resource group not found uniquely in landingZones.resourceGroups."
              continue
            }
            Invoke-Rbac "resource-group" "modules/access/rbac/RBAC_resource_group.bicep" "group" $rgName $entry
          }
          foreach ($entry in $resourceEntries) {
            if ([string]$entry.resourceType -ne "Microsoft.Storage/storageAccounts") {
              Add-Result "RBAC" "Resource" ([string]$entry.resourceName) ([string]$entry.principalEmail) ([string]$entry.roleDefinitionName) "FAILED" "" "The current resource RBAC template supports Storage Accounts only."
              continue
            }
            $rgName = [string]$entry.resourceGroupName
            $resourceName = [string]$entry.resourceName
            $matches = @($cfg.landingZones.storageAccounts | Where-Object { $_.name -eq $resourceName -and $_.resourceGroupName -eq $rgName })
            if ($matches.Count -ne 1) {
              Add-Result "RBAC" "Resource" $resourceName ([string]$entry.principalEmail) ([string]$entry.roleDefinitionName) "FAILED" "" "Storage Account not found uniquely in landingZones.storageAccounts."
              continue
            }
            Invoke-Rbac "resource" "modules/access/rbac/RBAC_resource.bicep" "group" $rgName $entry @{ storageAccountName=$resourceName }
          }

          # PIM accepts pim as an array, pim.accessRequests[], pim.roleEligibilityRequests[],
          # or one PIM request object containing a scope property.
          $pimEntries = @()
          if ($null -ne $cfg.pim) {
            if ($cfg.pim -is [System.Array]) { $pimEntries = @($cfg.pim) }
            elseif ($cfg.pim.PSObject.Properties["accessRequests"]) { $pimEntries = @(Get-Entries $cfg.pim "accessRequests") }
            elseif ($cfg.pim.PSObject.Properties["roleEligibilityRequests"]) { $pimEntries = @(Get-Entries $cfg.pim "roleEligibilityRequests") }
            elseif ($cfg.pim.PSObject.Properties["scope"]) { $pimEntries = @($cfg.pim) }
          }
          foreach ($entry in $pimEntries) { Invoke-Pim $entry }

          if ($subscriptionEntries.Count -eq 0 -and $resourceGroupEntries.Count -eq 0 -and $resourceEntries.Count -eq 0 -and $pimEntries.Count -eq 0) {
            Write-Host "No RBAC or PIM entries found in input.json. Access management is skipped."
          }

          $resultFile = Join-Path $env:RUNNER_TEMP "pike-access-results.json"
          $results | ConvertTo-Json -Depth 40 | Set-Content -Path $resultFile -Encoding utf8
          $results | Format-Table AccessType, Scope, Target, Principal, Role, Status -AutoSize
          $failed = @($results | Where-Object { $_.Status -eq "FAILED" })
          Write-Host "Total access requests: $($results.Count); failed: $($failed.Count)"
          if ($failed.Count -gt 0) { throw "One or more RBAC/PIM access requests failed. Review the PIKE-Access-Results artifact." }

      - name: Upload RBAC and PIM result report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PIKE-Access-Results-${{ github.run_id }}
          path: ${{ runner.temp }}/pike-access-results.json
          if-no-files-found: warn
          retention-days: 30
